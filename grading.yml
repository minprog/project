templates:
    1: &besproken
        type: pass
        subgrades:
            besproken: boolean
        calculation: besproken.to_i
        hide_calculated: true
    2: &project
        type: float
        subgrades:
            code: integer
            design: integer
            repo: integer
        calculation: ((code.to_i+design.to_i+repo.to_i).to_f/15*9+1).round(1)
        hide_calculated: false

grades:
    finance: *besproken
    books: *besproken

    algemeen_ds: *besproken
    climate_ds: *besproken
    regressie_ds: *besproken
    mushrooms_ds: *besproken
    yelp1_ds: *besproken
    yelp2_ds: *besproken
    projectvoorstel_ds: *besproken

    solar: *besproken
    mbot: *besproken

    proposal_ios: *besproken

    proposal: *besproken
    design: *besproken
    process: *besproken
    git: *besproken
    alpha: *besproken
    beta: *besproken
    screencast: *besproken
    final: *project

    versie1: *besproken
    versie2: *besproken
    versie3: *besproken
    versie4: *besproken

calculation:
    eindcijfer:
        project_milestones: 0
        project_uitwerking: 100

project_milestones:
    show_progress: true
    submits:
        proposal_ios: 1
        proposal: 1
        git: 1
        process: 1
        versie1: 1
        versie2: 1
        versie3: 1
        versie4: 1

project_uitwerking:
    submits:
        final: 1

flask:
    show_progress: true
    submits:
        finance: 1
        books: 1

ds:
    show_overview: true
    submits:
        algemeen_ds: 1
        climate_ds: 1
        regressie_ds: 1
        mushrooms_ds: 1
        yelp1_ds: 1
        yelp2_ds: 1
        projectvoorstel_ds: 1

arduino:
    show_overview: true
    submits:
        solar: 1
        mbot: 1
